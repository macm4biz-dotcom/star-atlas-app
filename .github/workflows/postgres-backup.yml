name: Postgres Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_BACKUP: ${{ secrets.DATABASE_URL_BACKUP }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '7' }}

    steps:
      - name: Validate backup configuration
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_BACKUP}" ]; then
            echo "DATABASE_URL_BACKUP is not configured in repository secrets"
            exit 1
          fi

      - name: Create compressed backup
        run: |
          set -euo pipefail
          ts=$(date -u +"%Y%m%dT%H%M%SZ")
          mkdir -p backup
          docker run --rm \
            -v "$PWD/backup:/backup" \
            postgres:18 \
            pg_dump --no-owner --no-privileges --format=custom --file "/backup/postgres-${ts}.dump" "${DATABASE_URL_BACKUP}"
          ls -lh backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: ${{ fromJSON(vars.BACKUP_RETENTION_DAYS || '7') }}
          if-no-files-found: error