name: Railway Deploy

# Railway deploys automatically via its own GitHub integration.
# This workflow only runs smoke tests after Railway deploys.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # Give Railway time to deploy before running smoke tests
    steps:
      - name: Wait for Railway deploy
        run: sleep 120

      - name: Smoke test API
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://star-atlasapi-production.up.railway.app/health)
          echo "API health status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Smoke test Web
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://web-production-1b799.up.railway.app/)
          echo "Web status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Verify shared cache config
        run: |
          HEALTH=$(curl -s https://star-atlasapi-production.up.railway.app/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"sharedCacheEnabled":true' && echo "✅ Shared cache ENABLED" || echo "⚠️ Shared cache DISABLED (check UPSTASH vars in Railway)"
