name: Uptime Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check web availability
        run: |
          set -euo pipefail
          echo "Checking web root..."
          status=$(curl -sS -o /tmp/web_root.json -w "%{http_code}" "https://web-production-1b799.up.railway.app/")
          echo "web / -> HTTP ${status}"
          test "${status}" = "200"

      - name: Check api health
        run: |
          set -euo pipefail
          echo "Checking API /health..."
          status=$(curl -sS -o /tmp/api_health.json -w "%{http_code}" "https://star-atlasapi-production.up.railway.app/health")
          echo "api /health -> HTTP ${status}"
          test "${status}" = "200"

      - name: Check api business endpoint
        run: |
          set -euo pipefail
          echo "Checking API /api/intel/overview..."
          status=$(curl -sS -o /tmp/api_intel.json -w "%{http_code}" "https://star-atlasapi-production.up.railway.app/api/intel/overview?limit=1")
          echo "api /api/intel/overview -> HTTP ${status}"
          test "${status}" = "200"

      - name: Upload response snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptime-response-snapshots
          path: |
            /tmp/web_root.json
            /tmp/api_health.json
            /tmp/api_intel.json
          if-no-files-found: ignore

      - name: Open or update uptime alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime Alert: Railway production check failed";
            const cooldownMinutes = 45;
            const cooldownMs = cooldownMinutes * 60 * 1000;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Automated uptime check failed.",
              "",
              `- Time (UTC): ${new Date().toISOString()}`,
              `- Workflow run: ${runUrl}`,
              "",
              "Check the uploaded artifact `uptime-response-snapshots` for response payloads.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });

            const existing = issues
              .filter((issue) => issue.title === title)
              .sort(
                (a, b) =>
                  new Date(b.updated_at || 0).getTime() -
                  new Date(a.updated_at || 0).getTime(),
              )[0];

            if (existing) {
              const wasClosed = existing.state !== "open";
              if (existing.state !== "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "open",
                });
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 100,
              });

              const latestFailureComment = comments
                .filter((comment) =>
                  String(comment.body || "").includes("Automated uptime check failed."),
                )
                .sort(
                  (a, b) =>
                    new Date(b.created_at || 0).getTime() -
                    new Date(a.created_at || 0).getTime(),
                )[0];

              const recentFailureExists = Boolean(
                latestFailureComment &&
                  Date.now() - new Date(latestFailureComment.created_at || 0).getTime() < cooldownMs,
              );

              if (recentFailureExists && !wasClosed) {
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Resolve uptime alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime Alert: Railway production check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              per_page: 100,
            });

            const hasRecoveryComment = comments.some((comment) =>
              String(comment.body || "").includes("Uptime checks recovered and are passing."),
            );

            if (!hasRecoveryComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  "Uptime checks recovered and are passing.",
                  "",
                  `- Time (UTC): ${new Date().toISOString()}`,
                  `- Recovery run: ${runUrl}`,
                ].join("\\n"),
              });
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: "closed",
            });
