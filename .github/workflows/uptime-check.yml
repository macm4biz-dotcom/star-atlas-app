name: Uptime Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check web availability
        run: |
          set -euo pipefail
          echo "Checking web root..."
          status=$(curl -sS -o /tmp/web_root.json -w "%{http_code}" "https://web-production-1b799.up.railway.app/")
          echo "web / -> HTTP ${status}"
          test "${status}" = "200"

      - name: Check api health
        run: |
          set -euo pipefail
          echo "Checking API /health..."
          status=$(curl -sS -o /tmp/api_health.json -w "%{http_code}" "https://star-atlasapi-production.up.railway.app/health")
          echo "api /health -> HTTP ${status}"
          test "${status}" = "200"

      - name: Check api business endpoint
        run: |
          set -euo pipefail
          echo "Checking API /api/intel/overview..."
          status=$(curl -sS -o /tmp/api_intel.json -w "%{http_code}" "https://star-atlasapi-production.up.railway.app/api/intel/overview?limit=1")
          echo "api /api/intel/overview -> HTTP ${status}"
          test "${status}" = "200"

      - name: Upload response snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptime-response-snapshots
          path: |
            /tmp/web_root.json
            /tmp/api_health.json
            /tmp/api_intel.json
          if-no-files-found: ignore

      - name: Open or update uptime alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime Alert: Railway production check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Automated uptime check failed.",
              "",
              `- Time (UTC): ${new Date().toISOString()}`,
              `- Workflow run: ${runUrl}`,
              "",
              "Check the uploaded artifact `uptime-response-snapshots` for response payloads.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Resolve uptime alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime Alert: Railway production check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: [
                "Uptime checks recovered and are passing.",
                "",
                `- Time (UTC): ${new Date().toISOString()}`,
                `- Recovery run: ${runUrl}`,
              ].join("\\n"),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: "closed",
            });
